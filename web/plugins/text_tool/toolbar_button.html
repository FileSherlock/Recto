<!-- text_tool's tools, in the tool column -->
<!-- Affinity's Artistic Text Tool: click or drag to create Artistic text (artistic-tool.js) -->
<button id="tt-art-text-btn" class="icon-button" title="Artistic Text Tool — click to type; drag to set the size; drag a corner to scale">
  <span class="material-symbols-outlined">title</span>
</button>
<!-- Affinity's Frame Text Tool: drag a frame, type paragraph text into it (frame-tool.js) -->
<button id="tt-frame-text-btn" class="icon-button" title="Frame Text Tool — drag to create a text frame; click a text object to edit it">
  <span class="material-symbols-outlined">insert_text</span>
</button>
<button id="tool-add-box" class="icon-button" title="Add Redaction Box (click on page)">
  <span class="material-symbols-outlined">add_box</span>
</button>
<!-- Undo / redo of what the user did to boxes (undo.js) -->
<button id="tt-undo" class="icon-button" title="Undo (Ctrl+Z)" disabled>
  <span class="material-symbols-outlined">undo</span>
</button>
<button id="tt-redo" class="icon-button" title="Redo (Ctrl+Shift+Z)" disabled>
  <span class="material-symbols-outlined">redo</span>
</button>
<!-- Text Formatting toggle button -->
<button id="toggle-fmt" class="icon-button" title="Text formatting">
  <span class="material-symbols-outlined">format_size</span>
</button>
<!-- The Text panel: Character, Paragraph, Text Frame and Typography (text-studio.js) -->
<button id="tt-studio-btn" class="icon-button" title="Text panel — Character, Paragraph, Text Frame, Typography">
  <span class="material-symbols-outlined">format_paragraph</span>
</button>
