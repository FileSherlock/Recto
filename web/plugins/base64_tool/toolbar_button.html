<!-- base64_tool: shows / hides the Attachments panel; the badge counts the
     attachments found in the open document -->
<button id="toggle-b64-tool" class="icon-button" title="Attachments — base64 email attachments decoded from the text">
  <span class="material-symbols-outlined">attach_file</span>
  <span id="b64-badge" class="b64-badge hidden" aria-hidden="true"></span>
</button>
